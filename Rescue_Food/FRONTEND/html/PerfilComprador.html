<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tu Perfil</title>
  <link rel="icon" href="../img/Lo.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div id="menu"></div>
<script>
  fetch("Menu.html")
    .then(response => response.text())
    .then(html => {
      document.getElementById("menu").innerHTML = html;
      const currentPage = window.location.pathname.split("/").pop().toLowerCase();
      const links = document.querySelectorAll("#menu .nav-link");
      links.forEach(link => {
        const linkPage = link.getAttribute("href")?.toLowerCase();
        if (linkPage === currentPage) {
          link.classList.add("active");
          link.style.fontWeight = "bold";
          link.style.color = "#fff";
          link.style.backgroundColor = "rgba(0,0,0,0.2)";
          link.style.borderRadius = "8px";
        }
      });

      const cartCountSpan = document.getElementById('cartCount');
      if (cartCountSpan) {
        const carrito = JSON.parse(localStorage.getItem('carrito')) || [];
        const totalItems = carrito.reduce((acc, item) => acc + item.cantidad, 0);
        cartCountSpan.innerText = totalItems;
      }
    });
</script>

<div class="container my-5">
  <h2 class="text-center fw-bold mb-3 text-success">Tu Cuenta</h2>
  <p id="saludoComprador" class="text-center text-muted mb-5">Bienvenido, Comprador</p>

  <div class="row g-4 justify-content-center">
    <div class="col-md-4">
      <div class="card text-center border-0 shadow-lg">
        <div class="card-body">
          <i class="bi bi-person-circle text-success display-4 mb-3"></i>
          <h4 class="card-title fw-semibold">Perfil</h4>
          <p class="card-text">Gestiona tu información personal, dirección y preferencias.</p>
          <button class="btn btn-success w-100" onclick="window.location.href='ConfiguracionComprador.html'">Ir a Perfil</button>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card text-center border-0 shadow-lg">
        <div class="card-body">
          <i class="bi bi-bag-check-fill text-success display-4 mb-3"></i>
          <h4 class="card-title fw-semibold">Mis Pedidos</h4>
          <p class="card-text">Revisa el historial de tus compras, su estado y detalles de entrega.</p>
          <button class="btn btn-success w-100" onclick="window.location.href='MisPedidos.html'">Ver Pedidos</button>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card text-center border-0 shadow-lg">
        <div class="card-body">
          <i class="bi bi-gear-fill text-success display-4 mb-3"></i>
          <h4 class="card-title fw-semibold">Configuraciones</h4>
          <p class="card-text">Ajusta las preferencias de la aplicación, notificaciones y seguridad.</p>
          <button class="btn btn-success w-100" onclick="window.location.href='ConfiguracionComprador.html'">Ir a Configuración</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="footer"></div>
<script>
  fetch("Footer.html")
    .then(response => response.text())
    .then(html => document.getElementById("footer").innerHTML = html);
</script>

<script src="../js/PerfilComprador.js"></script>
</body>
</html>
