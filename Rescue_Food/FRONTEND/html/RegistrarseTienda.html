<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro Tienda</title>
<link rel="icon" href="../img/Lo.ico">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<!--MENÚ -->
<div id="menu"></div>
<script>
fetch("Menu.html")
.then(r => r.arrayBuffer())
.then(buf => {
    const html = new TextDecoder("utf-8").decode(buf);
    document.getElementById("menu").innerHTML = html;
    // === Activar página ===
    const current = window.location.pathname.split("/").pop().toLowerCase();
    const links = document.querySelectorAll("#menu .nav-link");
    links.forEach(link => {
        const linkPage = link.getAttribute("href").toLowerCase();
        if (linkPage === current) {
            link.classList.add("active");
            link.style.fontWeight = "bold";
            link.style.color = "#fff";
            link.style.backgroundColor = "rgba(0,0,0,0.20)";
            link.style.borderRadius = "8px";
        }
    });
                // se actualiza el carrito
            const cartCountSpan = document.getElementById('cartCount');
            const updateCartCount = () => {
                let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
                const totalItems = carrito.reduce((acc, item) => acc + item.cantidad, 0);
                if(cartCountSpan) cartCountSpan.innerText = totalItems;
            };
            updateCartCount();
});
</script>

<!-- CONTENIDO PRINCIPAL-->
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-lg border-0 rounded-4 p-4">
                <h2 class="text-center mb-4 text-success">Registro Tienda</h2>
                <form id="formTienda">
                    <div class="mb-3">
                        <label class="form-label">Nombre de la Tienda</label>
                        <input type="text" id="nombre" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Correo electrónico</label>
                        <input type="email" id="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Teléfono</label>
                        <input type="text" id="telefono" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Dirección</label>
                        <input type="text" id="direccion" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Horario de Atención</label>
                        <select id="horario" class="form-control" required>
                            <option value="" disabled selected>Selecciona un horario</option>
                            <option value="6:00 AM - 12:00 PM">6:00 AM - 12:00 PM</option>
                            <option value="6:00 AM - 2:00 PM">6:00 AM - 2:00 PM</option>
                            <option value="6:00 AM - 6:00 PM">6:00 AM - 6:00 PM</option>
                            <option value="7:00 AM - 1:00 PM">7:00 AM - 1:00 PM</option>
                            <option value="7:00 AM - 5:00 PM">7:00 AM - 5:00 PM</option>
                            <option value="7:00 AM - 9:00 PM">7:00 AM - 9:00 PM</option>
                            <option value="8:00 AM - 12:00 PM">8:00 AM - 12:00 PM</option>
                            <option value="8:00 AM - 4:00 PM">8:00 AM - 4:00 PM</option>
                            <option value="8:00 AM - 8:00 PM">8:00 AM - 8:00 PM</option>
                            <option value="9:00 AM - 6:00 PM">9:00 AM - 6:00 PM</option>
                            <option value="9:00 AM - 9:00 PM">9:00 AM - 9:00 PM</option>
                            <option value="10:00 AM - 8:00 PM">10:00 AM - 8:00 PM</option>
                            <option value="10:00 AM - 9:00 PM">10:00 AM - 9:00 PM</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" id="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Registrarse</button>
                    <div id="mensajeRespuestaTienda" class="mt-3" aria-live="polite"></div>
                </form>
                <div class="text-center mt-3">
                    <p class="text-center text-muted">¿Ya tienes cuenta?</p>
                    <a href="IniciarSesionTienda.html" class="btn btn-outline-success w-100"> Iniciar Sesión </a>
                </div>
            </div>
        </div>
    </div>
</div>

<!--  FOOTER -->
<div id="footer"></div>
<script>
fetch("Footer.html")
.then(r => r.arrayBuffer())
.then(buf => {
    document.getElementById("footer").innerHTML = new TextDecoder("utf-8").decode(buf);
});
</script>

<!-- JS-->
<script src="../js/RegistroTienda.js"></script>
<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
