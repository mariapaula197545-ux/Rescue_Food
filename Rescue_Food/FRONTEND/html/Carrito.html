<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras</title>
    <link rel="icon" href="../img/Lo.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <!-- se incluye el menu-->
  <div id="menu"></div>
  <script>
      fetch("Menu.html")
      .then(response => response.arrayBuffer())
      .then(buffer => {
          const menuDiv = document.getElementById("menu");
          menuDiv.innerHTML = new TextDecoder("utf-8").decode(buffer);

          // Se activa la pagina 
          const currentPage = window.location.pathname.split("/").pop().toLowerCase();
          const links = menuDiv.querySelectorAll(".nav-link"); // Solo dentro del menú cargado

          links.forEach(link => {
              const linkPage = link.getAttribute("href")?.toLowerCase();
              if (linkPage === currentPage) {
                  link.classList.add("active");
                  link.style.fontWeight = "bold";
                  link.style.color = "#fff";
                  link.style.backgroundColor = "rgba(0,0,0,0.2)";
                  link.style.borderRadius = "8px";
              }
          });
            // se actualiza el carrito
            const cartCountSpan = document.getElementById('cartCount');
            const updateCartCount = () => {
                let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
                const totalItems = carrito.reduce((acc, item) => acc + item.cantidad, 0);
                if(cartCountSpan) cartCountSpan.innerText = totalItems;
            };
            updateCartCount();
        });
    </script>

    <!--Contenido principal de la pagina-->
    <div class="container py-5">
      <h2 class="text-center mb-4 text-success fw-bold">🛒 Tu Carrito de Compras</h2>

      <div class="row g-4">
        <!--Lista de productos -->
        <div class="col-lg-8">
          <div class="card shadow-lg border-0 rounded-4 p-4" id="carritoItems">
          </div>
        </div>

        <!--Resumen del pedido -->
        <div class="col-lg-4">
          <div class="card shadow-lg border-0 rounded-4 p-4">
            <h4 class="text-success fw-bold mb-3 text-center">Resumen del Pedido</h4>
            <p class="d-flex justify-content-between"><span>Subtotal:</span> <span id="subtotal">$0 COP</span></p>
            <p class="d-flex justify-content-between"><span>Costo de Envío:</span> <span>$5.000 COP</span></p>
            <hr>
            <p class="d-flex justify-content-between fw-bold fs-5"><span>Total a Pagar:</span> <span id="total">$0 COP</span></p>

            <div class="d-grid gap-2 mt-4">
              <button class="btn btn-success">Proceder al Pago</button>
              <button class="btn btn-outline-success" onclick="window.location.href='productos.html'">Continuar Comprando</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- FOOTER-->
    <div id="footer"></div>
    <script>
        fetch("Footer.html")
        .then(r => r.text())
        .then(h => document.getElementById("footer").innerHTML = h);
    </script>

    <!--SCRIPT DEL CARRITO -->
    <script>
      let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
      const carritoItems = document.getElementById('carritoItems');

      function mostrarCarrito() {
        carritoItems.innerHTML = '';
        let subtotal = 0;

        carrito.forEach((producto, index) => {
          const precioNum = parseInt(producto.precio.replace(/\D/g,'')); 
          subtotal += precioNum * producto.cantidad;

          const item = document.createElement('div');
          item.className = 'd-flex align-items-center border-bottom pb-3 mb-3';
          item.innerHTML = `
            <img src="${producto.img}" alt="${producto.nombre}" class="rounded me-3" style="width: 80px; height: 80px; object-fit: cover;">
            <div class="flex-grow-1">
              <h5 class="fw-semibold mb-1">${producto.nombre}</h5>
              <p class="mb-0"><span class="text-success fw-semibold">${producto.precio}</span></p>
            </div>
            <div class="d-flex align-items-center">
              <button class="btn btn-outline-success btn-sm me-2" onclick="modificarCantidad(${index}, -1)">-</button>
              <input type="text" class="form-control text-center" value="${producto.cantidad}" style="width: 50px;" readonly>
              <button class="btn btn-outline-success btn-sm ms-2" onclick="modificarCantidad(${index}, 1)">+</button>
              <button class="btn btn-link text-danger ms-3" onclick="eliminarProducto(${index})">✖</button>
            </div>
          `;
          carritoItems.appendChild(item);
        });

        document.getElementById('subtotal').innerText = `$${subtotal.toLocaleString()} COP`;
        document.getElementById('total').innerText = `$${(subtotal + 5000).toLocaleString()} COP`;
      }

      function modificarCantidad(index, cambio) {
        carrito[index].cantidad += cambio;
        if (carrito[index].cantidad < 1) carrito[index].cantidad = 1;
        localStorage.setItem('carrito', JSON.stringify(carrito));
        mostrarCarrito();
      }

      function eliminarProducto(index) {
        carrito.splice(index, 1);
        localStorage.setItem('carrito', JSON.stringify(carrito));
        mostrarCarrito();
      }

      mostrarCarrito();
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
