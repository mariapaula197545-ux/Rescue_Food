<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuración Comprador - RescueFood</title>
  <link rel="icon" href="../img/Lo.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div id="menu"></div>
<script>
  fetch("Menu.html")
    .then(response => response.text())
    .then(html => {
      document.getElementById("menu").innerHTML = html;
      const currentPage = window.location.pathname.split("/").pop().toLowerCase();
      const links = document.querySelectorAll("#menu .nav-link");
      links.forEach(link => {
        const linkPage = link.getAttribute("href")?.toLowerCase();
        if (linkPage === currentPage) {
          link.classList.add("active");
          link.style.fontWeight = "bold";
          link.style.color = "#fff";
          link.style.backgroundColor = "rgba(0,0,0,0.2)";
          link.style.borderRadius = "8px";
        }
      });

      const cartCountSpan = document.getElementById('cartCount');
      if (cartCountSpan) {
        const carrito = JSON.parse(localStorage.getItem('carrito')) || [];
        const totalItems = carrito.reduce((acc, item) => acc + item.cantidad, 0);
        cartCountSpan.innerText = totalItems;
      }
    });
</script>

<div class="container my-5">
  <h2 class="text-center fw-bold mb-5 text-success">Configuración del Perfil</h2>

  <div class="row">
    <div class="col-md-3 mb-4">
      <div class="list-group shadow-sm">
        <a class="list-group-item list-group-item-action active bg-success border-0" aria-current="true">Información Personal</a>
        <a class="list-group-item list-group-item-action">Dirección</a>
        <a class="list-group-item list-group-item-action">Preferencias</a>
        <a class="list-group-item list-group-item-action">Seguridad</a>
      </div>
    </div>

    <div class="col-md-9">
      <div class="card shadow-lg border-0">
        <div class="card-body p-4">
          <form id="formConfiguracionComprador">
            <div class="mb-3">
              <label for="nombre" class="form-label fw-semibold">Nombre</label>
              <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Escribe tu nombre" required>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label fw-semibold">Correo electrónico</label>
              <input type="email" id="email" name="email" class="form-control" placeholder="Escribe tu correo" required>
            </div>

            <div class="mb-3">
              <label for="direccion" class="form-label fw-semibold">Dirección</label>
              <input type="text" id="direccion" name="direccion" class="form-control" placeholder="Escribe tu dirección">
            </div>

            <div class="mb-3">
              <label for="foto_perfil" class="form-label fw-semibold">URL de foto de perfil</label>
              <input type="url" id="foto_perfil" name="foto_perfil" class="form-control" placeholder="https://...">
            </div>

            <button type="submit" class="btn btn-success w-100 py-2">Guardar Cambios</button>
            <div id="mensajePerfilComprador" class="mt-3" aria-live="polite"></div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="footer"></div>
<script>
  fetch("Footer.html")
    .then(response => response.text())
    .then(html => document.getElementById("footer").innerHTML = html);
</script>

<script src="../js/ConfiguracionComprador.js"></script>
</body>
</html>
