<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro Comprador</title>
<link rel="icon" href="../img/Lo.ico">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
<!-- MENÚ  -->
<div id="menu"></div>
<script>
fetch("Menu.html")
.then(response => response.text())
.then(html => {
    document.getElementById("menu").innerHTML = html;

    const currentPage = window.location.pathname.split("/").pop().toLowerCase();
    const menuLinks = document.querySelectorAll("#menu .nav-link");

    menuLinks.forEach(link => {
        const linkPage = link.getAttribute("href").toLowerCase();
        if (linkPage === currentPage) {
            link.classList.add("active");
            link.style.fontWeight = "bold";
            link.style.color = "#fff";
            link.style.backgroundColor = "rgba(0,0,0,0.20)";
            link.style.borderRadius = "8px";
        }
    });
                // se actualiza el carrito
            const cartCountSpan = document.getElementById('cartCount');
            const updateCartCount = () => {
                let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
                const totalItems = carrito.reduce((acc, item) => acc + item.cantidad, 0);
                if(cartCountSpan) cartCountSpan.innerText = totalItems;
            };
            updateCartCount();
});
</script>

<!-- CONTENIDO -->
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-lg border-0 rounded-4 p-4">
                <h2 class="text-center mb-4 text-success">Registro Comprador</h2>

                <form id="formComprador">
                    <div class="mb-3">
                        <label class="form-label">Nombre completo</label>
                        <input type="text" class="form-control" id="nombre" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>

                    <button type="submit" class="btn btn-success w-100">Registrarse</button>
                    <div id="mensajeRespuestaComprador" class="mt-3" aria-live="polite"></div>

                    <div class="text-center mt-3">
                        <p class="text-center text-muted">¿Ya tienes cuenta?</p>
                        <a href="IniciarSesionComprador.html" class="btn btn-outline-success w-100">Iniciar Sesión</a>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>

<!--FOOTER-->
<div id="footer"></div>
<script>
fetch("Footer.html")
.then(response => response.text())
.then(html => {
    document.getElementById("footer").innerHTML = html;
});
</script>

<!-- JS DEL FORMULARIO -->
<script src="../js/RegistroComprador.js"></script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
