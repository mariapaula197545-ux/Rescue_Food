<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecciona tu rol</title>

    <link rel="icon" href="../img/Lo.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <!--menu -->
  <div id="menu"></div>
  <script>
      fetch("Menu.html")
      .then(response => response.arrayBuffer())
      .then(buffer => {
          const menuDiv = document.getElementById("menu");
          menuDiv.innerHTML = new TextDecoder("utf-8").decode(buffer);

          // activar pagina
          const currentPage = window.location.pathname.split("/").pop().toLowerCase();
          const links = menuDiv.querySelectorAll(".nav-link");

          links.forEach(link => {
              const linkPage = link.getAttribute("href")?.toLowerCase();
              if (linkPage === currentPage) {
                  link.classList.add("active");
                  link.style.fontWeight = "bold";
                  link.style.color = "#fff";
                  link.style.backgroundColor = "rgba(0,0,0,0.2)";
                  link.style.borderRadius = "8px";
              }
          });
            // actualizar carrito
            const cartCountSpan = document.getElementById('cartCount');
            const updateCartCount = () => {
                let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
                const totalItems = carrito.reduce((acc, item) => acc + item.cantidad, 0);
                if(cartCountSpan) cartCountSpan.innerText = totalItems;
            };
            updateCartCount();
        });
    </script>

    <!--contenido principal -->
    <section class="container text-center my-5">
      <h2 class="fw-bold text-success mb-5">Selecciona tu rol</h2>

      <div class="row justify-content-center g-4">

        <!-- COMPRADOR -->
        <div class="col-12 col-md-5">
          <div class="card shadow-lg border-0 rounded-4 h-100">
            <div class="card-body d-flex flex-column align-items-center p-4">
              <img src="../img/Usuario.png" alt="Comprador" class="img-fluid mb-3" style="width: 120px;">
              <h3 class="fw-bold mb-4 text-success">Comprador</h3>
              <div class="d-grid gap-2 w-100">
                <button class="btn btn-outline-success fw-semibold" onclick="window.location.href='IniciarSesionComprador.html'">Iniciar Sesión</button>
                <button class="btn btn-success fw-semibold" onclick="window.location.href='RegistrarseComprador.html'">Registrarse</button>
              </div>
            </div>
          </div>
        </div>

        <!-- TIENDA -->
        <div class="col-12 col-md-5">
          <div class="card shadow-lg border-0 rounded-4 h-100">
            <div class="card-body d-flex flex-column align-items-center p-4">
              <img src="../img/Tienda.png" alt="Tienda" class="img-fluid mb-3" style="width: 120px;">
              <h3 class="fw-bold mb-4 text-success">Tienda</h3>
              <div class="d-grid gap-2 w-100">
                <button class="btn btn-outline-success fw-semibold" onclick="window.location.href='IniciarSesionTienda.html'">Iniciar Sesión</button>
                <button class="btn btn-success fw-semibold" onclick="window.location.href='RegistrarseTienda.html'">Registrarse</button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </section>

    <!--footer-->
    <div id="footer"></div>
    <script>
        fetch("Footer.html")
        .then(response => response.arrayBuffer())
        .then(buffer => {
            const html = new TextDecoder("utf-8").decode(buffer);
            document.getElementById("footer").innerHTML = html;
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
