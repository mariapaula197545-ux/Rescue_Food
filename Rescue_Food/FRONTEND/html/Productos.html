<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos Destacados</title>
    <link rel="icon" href="../img/Lo.ico">
    <link rel="stylesheet" href="../css/productos.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<!-- MENÚ -->
<div id="menu"></div>
<script>
    fetch("Menu.html")
    .then(r => r.text())
    .then(h => {
        const menuDiv = document.getElementById("menu");
        menuDiv.innerHTML = h;

        const currentPage = window.location.pathname.split("/").pop().toLowerCase();
        const links = menuDiv.querySelectorAll(".nav-link");

        links.forEach(link => {
            const linkPage = link.getAttribute("href")?.toLowerCase();
            if (linkPage === currentPage) {
                link.classList.add("active");
                link.style.fontWeight = "bold";
                link.style.color = "#fff";
                link.style.backgroundColor = "rgba(0,0,0,0.2)";
                link.style.borderRadius = "8px";
            }
        });

        const cartCount = menuDiv.querySelector('#cartCount');
        let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
        const totalItems = carrito.reduce((acc, item) => acc + item.cantidad, 0);
        if (cartCount) cartCount.innerText = totalItems;
    });
</script>

<!-- SECCIÓN DE PRODUCTOS -->
<section class="py-5 bg-light">
    <div class="container">
        <h2 class="text-center fw-bold text-success mb-5">Productos Disponibles</h2>

        <!-- FILTROS -->
        <div class="row mb-4 g-3">
            <div class="col-12 col-md-4">
                <label for="filtroCategoria" class="form-label fw-semibold">Categoría</label>
                <select id="filtroCategoria" class="form-select" onchange="aplicarFiltros()">
                    <option value="">Todas</option>
                </select>
            </div>

            <div class="col-12 col-md-8">
                <label for="busqueda" class="form-label fw-semibold">Buscar producto</label>
                <input
                    type="text"
                    id="busqueda"
                    class="form-control"
                    placeholder="Ej: banano, pan, leche..."
                    onkeyup="aplicarFiltros()"
                >
            </div>
        </div>

        <!-- LISTA DINÁMICA DE PRODUCTOS -->
        <div id="listaProductos" class="row g-4"></div>
    </div>
</section>

<!-- FOOTER -->
<div id="footer"></div>
<script>
    fetch("Footer.html")
        .then(r => r.text())
        .then(h => document.getElementById("footer").innerHTML = h);
</script>

<!-- SCRIPT DE PRODUCTOS -->
<script src="../js/Productos.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
