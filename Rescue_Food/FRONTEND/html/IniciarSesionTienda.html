<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión Tienda</title>
  <link rel="icon" href="../img/Lo.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div id="menu"></div>
<script>
  fetch("Menu.html")
    .then(response => response.arrayBuffer())
    .then(buffer => {
      const html = new TextDecoder("utf-8").decode(buffer);
      document.getElementById("menu").innerHTML = html;

      const cartCountSpan = document.getElementById('cartCount');
      const updateCartCount = () => {
        const carrito = JSON.parse(localStorage.getItem('carrito')) || [];
        const totalItems = carrito.reduce((acc, item) => acc + item.cantidad, 0);
        if (cartCountSpan) cartCountSpan.innerText = totalItems;
      };
      updateCartCount();
    });
</script>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card shadow-lg border-0 rounded-4 p-4">
        <h2 class="text-center mb-4 text-success">Iniciar Sesión - Tienda</h2>

        <form id="formLoginTienda">
          <div class="mb-3">
            <label class="form-label fw-semibold text-dark">Correo electrónico</label>
            <input type="email" class="form-control border-success-subtle" id="email" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold text-dark">Contraseña</label>
            <input type="password" class="form-control border-success-subtle" id="password" required>
          </div>

          <button type="submit" class="btn btn-success w-100 py-2">Iniciar Sesión</button>
          <div id="mensajeRespuestaTienda" class="mt-3" aria-live="polite"></div>
        </form>

        <div class="text-center mt-3">
          <p class="text-muted">¿No tienes cuenta?</p>
          <a href="RegistrarseTienda.html" class="btn btn-outline-success w-100">Registrarse</a>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="footer"></div>
<script>
  fetch("Footer.html")
    .then(response => response.text())
    .then(html => document.getElementById("footer").innerHTML = html);
</script>

<script src="../js/LoginTienda.js"></script>
</body>
</html>
