<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiendas Aliadas</title>
    <link rel="icon" href="../img/Lo.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/Tiendas.css">
</head>
<body>
    <!--menu -->
    <div id="menu"></div>
    <script>
        fetch("Menu.html")
        .then(r => r.arrayBuffer())
        .then(buffer => {
            const menuDiv = document.getElementById("menu");
            menuDiv.innerHTML = new TextDecoder("utf-8").decode(buffer);

            // activar pagina 
            const currentPage = window.location.pathname.split("/").pop().toLowerCase();
            const links = menuDiv.querySelectorAll(".nav-link");

            links.forEach(link => {
                const linkPage = link.getAttribute("href")?.toLowerCase();
                if (linkPage === currentPage) {
                    link.classList.add("active");
                    link.style.fontWeight = "bold";
                    link.style.color = "#fff";
                    link.style.backgroundColor = "rgba(0,0,0,0.2)";
                    link.style.borderRadius = "8px";
                }
            });
            // actualizar carrito
            const cartCountSpan = document.getElementById('cartCount');
            const updateCartCount = () => {
                let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
                const totalItems = carrito.reduce((acc, item) => acc + item.cantidad, 0);
                if(cartCountSpan) cartCountSpan.innerText = totalItems;
            };
            updateCartCount();
        });
    </script>

    <!--contenido principal-->
    <section class="py-5 bg-light text-center">
      <div class="container">
        <h1 class="fw-bold text-success mb-5">Tiendas Aliadas</h1>
        <div class="row g-4 justify-content-center">

          <div class="col-12 col-md-4">
            <a href="https://www.mercacentro.com" target="_blank" class="card border-0 shadow-sm p-4 hover-card text-decoration-none">
              <img src="../img/mercacentro.png" alt="Mercacentro" class="img-fluid mx-auto d-block" style="width:150px; height:150px;">
            </a>
          </div>

          <div class="col-12 col-md-4">
            <a href="https://aratiendas.com/" target="_blank" class="card border-0 shadow-sm p-4 hover-card text-decoration-none">
              <img src="../img/ara.webp" alt="Ara" class="img-fluid mx-auto d-block" style="width:150px; height:150px;">
            </a>
          </div>

          <div class="col-12 col-md-4">
            <a href="https://d1.com.co/" target="_blank" class="card border-0 shadow-sm p-4 hover-card text-decoration-none">
              <img src="../img/d1.webp" alt="D1" class="img-fluid mx-auto d-block" style="width:150px; height:150px;">
            </a>
          </div>

          <div class="col-12 col-md-4">
            <a href="https://tiendasisimo.com/somo-isimo/" target="_blank" class="card border-0 shadow-sm p-4 hover-card text-decoration-none">
              <img src="../img/isimo.webp" alt="Isimo" class="img-fluid mx-auto d-block" style="width:150px; height:150px;">
            </a>
          </div>

          <div class="col-12 col-md-4">
            <a href="https://www.surtiplaza.co" target="_blank" class="card border-0 shadow-sm p-4 hover-card text-decoration-none">
              <img src="../img/surti.png" alt="Surtiplaza" class="img-fluid mx-auto d-block" style="width:150px; height:150px;">
            </a>
          </div>

          <div class="col-12 col-md-4">
            <a href="https://www.exito.com/" target="_blank" class="card border-0 shadow-sm p-4 hover-card text-decoration-none">
              <img src="../img/exito.webp" alt="Éxito" class="img-fluid mx-auto d-block" style="width:150px; height:150px;">
            </a>
          </div>

        </div>
      </div>
    </section>

    <!--footer -->
    <div id="footer"></div>
    <script>
        fetch("Footer.html")
        .then(r => r.arrayBuffer())
        .then(buffer => {
            document.getElementById("footer").innerHTML = new TextDecoder("utf-8").decode(buffer);
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
