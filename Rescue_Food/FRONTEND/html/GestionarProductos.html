<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestionar Productos - RescueFood</title>
  <link rel="icon" href="../img/Lo.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Menú -->
<div id="menu"></div>
<script>
  fetch("Menu.html")
    .then(response => response.text())
    .then(html => {
      const menuDiv = document.getElementById("menu");
      menuDiv.innerHTML = html;

      const currentPage = window.location.pathname.split("/").pop().toLowerCase();
      const links = menuDiv.querySelectorAll(".nav-link");

      links.forEach(link => {
        const linkPage = link.getAttribute("href")?.toLowerCase();
        if (linkPage === currentPage) {
          link.classList.add("active");
          link.style.fontWeight = "bold";
          link.style.color = "#fff";
          link.style.backgroundColor = "rgba(0,0,0,0.2)";
          link.style.borderRadius = "8px";
        }
      });
    });
</script>

<!-- Contenido principal -->
<div class="container my-5">
  <h2 class="fw-bold text-success text-center mb-4">Gestionar Productos</h2>

  <div class="card shadow-sm p-4 mx-auto mb-5" style="max-width: 700px;">
    <form id="formProducto" onsubmit="crearProducto(event)">
      
      <div class="mb-3">
        <label for="categoria" class="form-label fw-semibold">Categoría:</label>
        <select class="form-select" id="categoria" required>
          <option value="">Cargando categorías...</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="nombre" class="form-label fw-semibold">Nombre del Producto:</label>
        <input type="text" class="form-control" id="nombre" required>
      </div>

      <div class="mb-3">
        <label for="precio" class="form-label fw-semibold">Precio:</label>
        <input type="number" class="form-control" id="precio" required>
      </div>

      <div class="mb-3">
        <label for="stock" class="form-label fw-semibold">Stock:</label>
        <input type="number" class="form-control" id="stock" value="0" min="0">
      </div>

      <div class="mb-3">
        <label for="descripcion" class="form-label fw-semibold">Características / Descripción:</label>
        <textarea class="form-control" id="descripcion" rows="4" required></textarea>
      </div>

      <div class="mb-3">
        <label for="imagen" class="form-label fw-semibold">URL de la imagen:</label>
        <input type="text" class="form-control" id="imagen" placeholder="https://...">
      </div>

      <div class="d-grid mb-3">
        <button type="submit" class="btn btn-success">Guardar Producto</button>
      </div>
    </form>

    <div id="mensajeExito" class="alert alert-success text-center fw-semibold" style="display:none;">
      Producto registrado con éxito
    </div>

    <div id="mensajeError" class="alert alert-danger text-center fw-semibold" style="display:none;">
      Ocurrió un error al guardar el producto
    </div>

    <div class="d-grid">
      <button class="btn btn-outline-success" onclick="window.location.href='ConfiguracionTienda.html'">
        Configuración de la Tienda
      </button>
    </div>
  </div>

  <h3 class="fw-bold text-success mb-4 text-center">Mis Productos</h3>
  <div id="misProductos" class="row g-4"></div>
</div>

<!-- Footer -->
<div id="footer"></div>
<script>
  fetch("Footer.html")
    .then(response => response.text())
    .then(html => document.getElementById("footer").innerHTML = html);
</script>

<!-- Script del módulo -->
<script src="../js/GestionarProductos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
