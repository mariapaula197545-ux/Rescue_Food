<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil de la Tienda</title>
  <link rel="icon" href="../img/Lo.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div id="menu"></div>
<script>
  fetch("Menu.html")
    .then(response => response.text())
    .then(html => document.getElementById("menu").innerHTML = html);
</script>

<div class="container text-center my-5">
  <h2 class="fw-bold text-success mb-4">Perfil de la Tienda</h2>
  <div class="card mx-auto p-4 border-0 shadow-sm" style="max-width: 420px;">
    <img id="logoTiendaPerfil" src="../img/sofia.webp" class="rounded-circle mx-auto mb-3" alt="Foto Tienda" width="150" height="150">
    <h3 id="nombreTiendaPerfil" class="fw-semibold mb-2">Mi Tienda</h3>
    <p id="nombreCuentaTienda" class="text-muted mb-4">Cuenta de tienda</p>

    <div class="d-grid gap-3">
      <button class="btn btn-success" onclick="window.location.href='GestionarProductos.html'">
        Gestionar Productos
      </button>
      <button class="btn btn-outline-success" onclick="window.location.href='ConfiguracionTienda.html'">
        Configuración de la Tienda
      </button>
    </div>
  </div>
</div>

<div id="footer"></div>
<script>
  fetch("Footer.html")
    .then(response => response.text())
    .then(html => document.getElementById("footer").innerHTML = html);
</script>

<script src="../js/PerfilTienda.js"></script>
</body>
</html>
