<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contáctanos</title>

    <link rel="icon" href="../img/Lo.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <!--MENÚ-->
    <div id="menu"></div>
    <script>
        fetch("Menu.html")
        .then(response => response.arrayBuffer())
        .then(buffer => {
            const menuDiv = document.getElementById("menu");
            menuDiv.innerHTML = new TextDecoder("utf-8").decode(buffer);

             // Se activa la pagina 
            const currentPage = window.location.pathname.split("/").pop().toLowerCase();
            const links = menuDiv.querySelectorAll(".nav-link");

            links.forEach(link => {
                const linkPage = link.getAttribute("href")?.toLowerCase();
                if (linkPage === currentPage) {
                    link.classList.add("active");
                    link.style.fontWeight = "bold";
                    link.style.color = "#fff";
                    link.style.backgroundColor = "rgba(0,0,0,0.2)";
                    link.style.borderRadius = "8px";
                }
            });
            // se actualiza el carrito
            const cartCountSpan = document.getElementById('cartCount');
            const updateCartCount = () => {
                let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
                const totalItems = carrito.reduce((acc, item) => acc + item.cantidad, 0);
                if(cartCountSpan) cartCountSpan.innerText = totalItems;
            };
            updateCartCount();
        });
    </script>

    <!--CONTENIDO PRINCIPAL-->
    <section class="container my-5">
      <h1 class="text-center text-success fw-bold mb-5">Contáctanos</h1>

      <div class="row align-items-center g-4">
        <div class="col-12 col-md-6">
          <div class="ratio ratio-4x3 shadow rounded-4 overflow-hidden">
            <iframe 
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3976.238346344861!2d-75.19666458464594!3d4.438889843053537!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8e38850f546a7b33%3A0x5e8c4231b8e5a0f7!2sCalle%2014%20%237-77%2C%20Ibagu%C3%A9%2C%20Tolima%2C%20Colombia!5e0!3m2!1ses!2ses!4v1694858100000!5m2!1ses!2ses"
              allowfullscreen 
              loading="lazy">
            </iframe>
          </div>
        </div>

        <div class="col-12 col-md-6">
          <div class="p-4 bg-white rounded-4 shadow-sm">
            <h2 class="text-success fw-bold mb-3">Visítanos</h2>
            <p class="text-secondary mb-4">
              ¿Tienes preguntas, sugerencias o quieres unirte como tienda aliada?
              Estamos aquí para escucharte y ayudarte.
            </p>

            <p class="mb-3">
              📍 <strong>Ibagué, Tolima</strong><br>
              Calle 14 #7-77, Centro
            </p>

            <p class="mb-3">
              📞 <strong>Tel:</strong> +57 300 000 0000<br>
              ✉ <strong>Email:</strong> 
              <a href="mailto:contacto@rescuefood.com" class="text-success text-decoration-none">
                contacto@rescuefood.com
              </a>
            </p>

            <p>🕒 <strong>Horario:</strong> Lunes a Viernes <br> 8:00 a.m. – 6:00 p.m.</p>
          </div>
        </div>
      </div>
    </section>

    <!--FOOTER -->
    <div id="footer"></div>
    <script>
        fetch("Footer.html")
        .then(response => response.arrayBuffer())
        .then(buffer => {
            const html = new TextDecoder("utf-8").decode(buffer);
            document.getElementById("footer").innerHTML = html;
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
