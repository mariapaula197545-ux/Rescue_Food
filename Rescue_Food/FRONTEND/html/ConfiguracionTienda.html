<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuración Tienda</title>
  <link rel="icon" href="../img/Lo.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div id="menu"></div>
<script>
  fetch("Menu.html")
    .then(response => response.text())
    .then(html => document.getElementById("menu").innerHTML = html);
</script>

<div class="container my-5">
  <h2 class="fw-bold text-success text-center mb-4">Configuración de la Tienda</h2>

  <div class="row">
    <div class="col-md-3 mb-4">
      <div class="list-group shadow-sm">
        <a href="#" class="list-group-item list-group-item-action active bg-success border-success" aria-current="true">
          Información de la Tienda
        </a>
        <a href="#" class="list-group-item list-group-item-action">Notificaciones</a>
        <a href="#" class="list-group-item list-group-item-action">Seguridad</a>
        <a href="#" class="list-group-item list-group-item-action">Soporte</a>
      </div>
    </div>

    <div class="col-md-9">
      <div class="card shadow-sm p-4">
        <form id="formConfiguracionTienda">
          <div class="mb-3">
            <label for="nombre" class="form-label fw-semibold">Nombre de la cuenta:</label>
            <input type="text" class="form-control" id="nombre" name="nombre" required>
          </div>

          <div class="mb-3">
            <label for="nombre_tienda" class="form-label fw-semibold">Nombre de la tienda:</label>
            <input type="text" class="form-control" id="nombre_tienda" name="nombre_tienda" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Correo electrónico:</label>
            <input type="email" class="form-control" id="email" name="email" required>
          </div>

          <div class="mb-3">
            <label for="telefono" class="form-label fw-semibold">Teléfono:</label>
            <input type="text" class="form-control" id="telefono" name="telefono">
          </div>

          <div class="mb-3">
            <label for="direccion" class="form-label fw-semibold">Dirección:</label>
            <input type="text" class="form-control" id="direccion" name="direccion">
          </div>

          <div class="mb-3">
            <label for="horario" class="form-label fw-semibold">Horario:</label>
            <input type="text" class="form-control" id="horario" name="horario" placeholder="Ej: 8:00 AM - 6:00 PM">
          </div>

          <div class="mb-3">
            <label for="logo_url" class="form-label fw-semibold">URL del logo:</label>
            <input type="url" class="form-control" id="logo_url" name="logo_url" placeholder="https://...">
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-success">Guardar Configuración</button>
          </div>
          <div id="mensajeConfiguracionTienda" class="mt-3" aria-live="polite"></div>
        </form>
      </div>
    </div>
  </div>
</div>

<div id="footer"></div>
<script>
  fetch("Footer.html")
    .then(response => response.text())
    .then(html => document.getElementById("footer").innerHTML = html);
</script>

<script src="../js/ConfiguracionTienda.js"></script>
</body>
</html>
